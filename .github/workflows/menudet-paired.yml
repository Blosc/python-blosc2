name: Menudet paired qualification

# Keep release dependency pins unchanged. Qualification explicitly selects the
# experimental native revision and fails rather than hiding missing capabilities.
on:
  push:
    branches: [numpy-compat]
  workflow_dispatch:
    inputs:
      native_ref:
        description: Exact Blosc/miniexpr revision to qualify with this Python revision
        required: true
        type: string

jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      MENUDET_REQUIRE_ARRAY_RUNTIME: '1'
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Blosc/miniexpr
          ref: ${{ inputs.native_ref || 'numpy-compat' }}
          path: native
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: blosc2
          python-version: '3.12'
          auto-activate-base: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        run: |
          echo 'CC=clang-cl' >> "$GITHUB_ENV"
          echo 'CXX=clang-cl' >> "$GITHUB_ENV"
      - name: Build explicit native and Python pair
        run: |
          python -m pip install ninja cmake
          cmake -S native -B native-build -DMINIEXPR_BUILD_ARTIFACT=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build native-build --parallel 4
          python -m pip install -e . --group test --config-settings="cmake.define.FETCHCONTENT_SOURCE_DIR_MINIEXPR=$PWD/native"
          python -m pip install 'numpy==2.5.3'
      - name: Require corpus and native array capabilities
        run: |
          export MENUDET_NUMPY_FUNCTION_CORPUS="$PWD/native/tests/numpy-compat/functions-v1.1.json"
          export MENUDET_NUMPY_ARITHMETIC_CORPUS="$PWD/native/tests/numpy-compat/arithmetic-v1.1.json"
          export MENUDET_NUMPY_CORPUS="$PWD/native/tests/numpy-compat/vectors.json"
          export MENUDET_NUMPY_CORPUS_V2="$PWD/native/tests/numpy-compat/vectors-v2.json"
          export MENUDET_NUMPY_RUNNER="$PWD/native-build/tests/numpy_compat_runner"
          if [ "$RUNNER_OS" = Windows ]; then
            export MENUDET_NUMPY_RUNNER="${MENUDET_NUMPY_RUNNER}.exe"
            export PATH="$PWD/native-build:$PATH"
          fi
          ctest --test-dir native-build --output-on-failure
          python -m pytest tests/test_menudet_arrays.py tests/test_menudet_native_graph.py tests/test_menudet_functions.py tests/test_menudet_arithmetic.py tests/test_menudet_conformance.py -q -n 0
      - name: Record exact paired revisions
        if: always()
        run: |
          git rev-parse HEAD > paired-revisions.txt
          git -C native rev-parse HEAD >> paired-revisions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menudet-pair-${{ matrix.os }}
          path: |
            paired-revisions.txt
            native-build/Testing/Temporary/LastTest.log
